<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Pass — Architecture GitHub interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Source+Sans+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF7F1;
    --cream-deep: #F2EBDF;
    --burgundy: #A3695B;
    --burgundy-dark: #8B5448;
    --champagne: #C2B59B;
    --text: #2C2826;
    --text-soft: #54504E;
    --text-mute: #7A7470;
    --divider: #E5DBC8;
    --bg-source: #E8DFCE;
    --bg-orch: #C2B59B;
    --bg-engine: #A3695B;
    --bg-front: #F2EBDF;
    --bg-email: #54504E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Source Sans Pro', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--text);
    overflow: hidden;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(251, 247, 241, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--divider);
    padding: 14px 32px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    color: var(--text);
    letter-spacing: 0.04em;
  }
  header .brand em {
    color: var(--burgundy);
    font-style: italic;
  }
  header .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-mute);
  }
  header .legend .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  header .controls {
    display: flex; gap: 8px;
  }
  header button {
    background: transparent;
    border: 1px solid var(--divider);
    color: var(--text-soft);
    padding: 6px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
    transition: all 150ms;
  }
  header button:hover {
    background: var(--burgundy);
    color: white;
    border-color: var(--burgundy);
  }

  #canvas {
    width: 100vw;
    height: 100vh;
    cursor: grab;
    padding-top: 60px;
  }
  #canvas.dragging { cursor: grabbing; }
  #canvas svg {
    width: 100%;
    height: 100%;
  }

  .node-group { cursor: pointer; }
  .node-rect {
    transition: filter 200ms, transform 200ms;
  }
  .node-group:hover .node-rect {
    filter: drop-shadow(0 8px 16px rgba(44, 40, 38, 0.18));
  }
  .node-label {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .node-sub {
    font-family: 'Source Sans Pro', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
    text-anchor: middle;
  }
  .node-detail {
    font-family: 'Source Sans Pro', sans-serif;
    font-size: 12px;
    pointer-events: none;
    text-anchor: middle;
    fill: var(--text-soft);
  }
  .arrow {
    fill: none;
    stroke: var(--burgundy);
    stroke-width: 2;
    marker-end: url(#arrowhead);
    opacity: 0.7;
  }
  .arrow-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    fill: var(--text-mute);
    font-family: 'Source Sans Pro', sans-serif;
    text-anchor: middle;
  }
  .section-band {
    fill: none;
    stroke: var(--divider);
    stroke-dasharray: 4 4;
  }
  .section-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 14px;
    font-style: italic;
    fill: var(--text-mute);
  }

  /* Side panel */
  #panel {
    position: fixed;
    top: 60px;
    right: 0;
    bottom: 0;
    width: 440px;
    background: white;
    border-left: 1px solid var(--divider);
    padding: 32px 28px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -10px 0 30px rgba(44, 40, 38, 0.08);
    z-index: 50;
  }
  #panel.open { transform: translateX(0); }
  #panel .close {
    position: absolute;
    top: 18px; right: 18px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: var(--text-mute);
    line-height: 1;
  }
  #panel .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--burgundy);
    margin-bottom: 12px;
    font-weight: 600;
  }
  #panel h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.2;
    color: var(--text);
    margin-bottom: 6px;
  }
  #panel .repo {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12px;
    color: var(--text-mute);
    margin-bottom: 22px;
    word-break: break-all;
  }
  #panel h3 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--text);
    margin: 22px 0 10px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--divider);
  }
  #panel p, #panel li {
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.6;
    margin-bottom: 6px;
  }
  #panel ul { padding-left: 18px; }
  #panel code {
    font-family: ui-monospace, monospace;
    background: var(--cream-deep);
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 12px;
    color: var(--burgundy-dark);
  }
  #panel pre {
    background: var(--cream-deep);
    border: 1px solid var(--divider);
    padding: 14px;
    border-radius: 2px;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    overflow-x: auto;
    margin: 10px 0;
    color: var(--text);
  }
  #panel a {
    color: var(--burgundy);
    text-decoration: none;
    border-bottom: 1px solid var(--burgundy);
  }
  #panel .pill {
    display: inline-block;
    background: var(--cream-deep);
    color: var(--burgundy);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 2px;
    margin-right: 4px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Bottom hint */
  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--divider);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 12px;
    color: var(--text-mute);
    box-shadow: 0 4px 16px rgba(44, 40, 38, 0.06);
    pointer-events: none;
  }
  .hint kbd {
    background: var(--cream-deep);
    border: 1px solid var(--divider);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: ui-monospace, monospace;
    font-size: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">Body <em>Pass</em> · Architecture GitHub interactive</div>
  <div class="legend">
    <span><span class="dot" style="background: var(--bg-source)"></span>Source</span>
    <span><span class="dot" style="background: var(--bg-orch)"></span>Orchestration</span>
    <span><span class="dot" style="background: var(--bg-engine)"></span>Moteur</span>
    <span><span class="dot" style="background: var(--bg-front)"></span>Pages porteurs</span>
    <span><span class="dot" style="background: var(--bg-email)"></span>Email</span>
  </div>
  <div class="controls">
    <button id="zoomIn">＋</button>
    <button id="zoomOut">−</button>
    <button id="reset">Reset</button>
    <button id="export">Export PNG</button>
  </div>
</header>

<div id="canvas">
  <svg viewBox="0 0 2280 1080" preserveAspectRatio="xMidYMid meet" id="svgRoot">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#A3695B" />
      </marker>
    </defs>
    <g id="viewport">

      <!-- Section bands -->
      <rect class="section-band" x="40" y="60" width="340" height="380" rx="4"/>
      <text class="section-title" x="60" y="50">1. Source de vérité</text>

      <rect class="section-band" x="400" y="60" width="340" height="380" rx="4"/>
      <text class="section-title" x="420" y="50">2. Orchestration n8n</text>

      <rect class="section-band" x="760" y="60" width="540" height="720" rx="4"/>
      <text class="section-title" x="780" y="50">3. Moteur Python (GitHub Actions)</text>

      <rect class="section-band" x="1460" y="60" width="380" height="720" rx="4"/>
      <text class="section-title" x="1480" y="50">4. Pages porteurs (GitHub Pages)</text>

      <rect class="section-band" x="1900" y="60" width="320" height="720" rx="4"/>
      <text class="section-title" x="1920" y="50">5. Archives & CDN</text>

      <rect class="section-band" x="40" y="820" width="2200" height="260" rx="4"/>
      <text class="section-title" x="60" y="810">6. Diffusion email · Mailchimp + Apps Script · Page interne</text>


      <!-- ===================== 1. SOURCE ===================== -->
      <g class="node-group" data-id="source-csv">
        <rect class="node-rect" x="80" y="110" width="260" height="100" rx="3" fill="#E8DFCE" stroke="#C2B59B"/>
        <text class="node-sub" x="210" y="138" fill="#54504E">SOURCE WOOCOMMERCE</text>
        <text class="node-label" x="210" y="166" fill="#2C2826" font-size="17">Exports CSV nocturnes</text>
        <text class="node-detail" x="210" y="190">membres · instituts · visites</text>
      </g>

      <g class="node-group" data-id="gmail">
        <rect class="node-rect" x="80" y="240" width="260" height="100" rx="3" fill="#FBF7F1" stroke="#C2B59B"/>
        <text class="node-sub" x="210" y="268" fill="#54504E">EMAIL</text>
        <text class="node-label" x="210" y="296" fill="#2C2826" font-size="17">Boîte info@bodypass.ch</text>
        <text class="node-detail" x="210" y="320">3 pièces jointes CSV/nuit</text>
      </g>


      <!-- ===================== 2. N8N ===================== -->
      <g class="node-group" data-id="n8n">
        <rect class="node-rect" x="430" y="160" width="280" height="220" rx="3" fill="#C2B59B" stroke="#A3695B"/>
        <text class="node-sub" x="570" y="190" fill="#2C2826">N8N CLOUD · 6H45</text>
        <text class="node-label" x="570" y="218" fill="#FBF7F1" font-size="17">bp-moteur-campagnes</text>
        <text class="node-detail" x="570" y="244" fill="#FBF7F1">workflow 13 nodes</text>
        <text class="node-detail" x="570" y="272" fill="#F2EBDF" font-size="11">Gmail → push CSV</text>
        <text class="node-detail" x="570" y="290" fill="#F2EBDF" font-size="11">→ dispatch GH Action</text>
        <text class="node-detail" x="570" y="308" fill="#F2EBDF" font-size="11">→ artifact + PATCH Mailchimp</text>
        <text class="node-detail" x="570" y="338" fill="#F2EBDF" font-size="11">cap 1500/jour</text>
      </g>


      <!-- ===================== 3. ENGINE (big container) ===================== -->

        <text class="node-label" x="1030" y="156" fill="#FBF7F1" font-size="24" pointer-events="none">bodypass-campaigns-engine</text>
      </g>

      <!-- Sub-modules INSIDE engine container (shifted down to leave room for the bigger header) -->

        <rect class="node-rect" x="800" y="190" width="220" height="78" rx="3" fill="#FFFFFF" stroke="#C2B59B"/>
        <text class="node-sub" x="910" y="214" fill="#54504E">GH ACTIONS</text>

        <text class="node-label" x="1150" y="238" fill="#2C2826" font-size="14">orchestrator.py</text>
        <text class="node-detail" x="1150" y="256" fill="#54504E" font-size="10">3 segments + cap 1500</text>
      </g>

      <g class="node-group" data-id="core">
        <rect class="node-rect" x="800" y="286" width="220" height="98" rx="3" fill="#F2EBDF" stroke="#C2B59B"/>
        <text class="node-sub" x="910" y="310" fill="#54504E">LIBRAIRIE COMMUNE</text>
        <text class="node-label" x="910" y="334" fill="#2C2826" font-size="14">core/</text>
        <text class="node-detail" x="910" y="352" fill="#54504E" font-size="10">csv_loader · tokens</text>
        <text class="node-detail" x="910" y="368" fill="#54504E" font-size="10">features · render</text>
      </g>

      <g class="node-group" data-id="campaigns">
        <rect class="node-rect" x="1040" y="286" width="220" height="98" rx="3" fill="#F2EBDF" stroke="#C2B59B"/>
        <text class="node-sub" x="1150" y="310" fill="#54504E">SEGMENTS</text>
        <text class="node-label" x="1150" y="334" fill="#2C2826" font-size="14">campaigns/</text>
        <text class="node-detail" x="1150" y="352" fill="#54504E" font-size="10">yesterday · utilization</text>
        <text class="node-detail" x="1150" y="368" fill="#54504E" font-size="10">bilan_30d · ideas</text>
      </g>

      <g class="node-group" data-id="scrapers">
        <rect class="node-rect" x="800" y="402" width="460" height="78" rx="3" fill="#F2EBDF" stroke="#C2B59B"/>
        <text class="node-sub" x="1030" y="426" fill="#54504E">SCRAPER HEBDO (DIMANCHE)</text>
        <text class="node-label" x="1030" y="450" fill="#2C2826" font-size="14">scrapers/etablissement_photos.py</text>
        <text class="node-detail" x="1030" y="468" fill="#54504E" font-size="10">bodypass.ch → 1200×800 JPEG q80</text>
      </g>

      <!-- data-inbox (non-clickable annotation) -->
      <rect x="800" y="498" width="460" height="46" rx="3" fill="#FFFFFF" stroke="#C2B59B" stroke-dasharray="4 4"/>
      <text class="node-sub" x="1030" y="518" fill="#7A7470" pointer-events="none">DATA-INBOX/ · gitignored</text>
      <text class="node-detail" x="1030" y="534" fill="#7A7470" font-size="10" pointer-events="none">drop zone n8n · 3 CSVs/nuit</text>

      <!-- Outputs zone -->
      <rect x="800" y="562" width="460" height="200" rx="3" fill="#FBF7F1" stroke="#C2B59B"/>
      <text class="node-sub" x="1030" y="584" fill="#A3695B" pointer-events="none">SORTIES DU RUN</text>
      <text class="node-detail" x="1030" y="612" fill="#54504E" font-size="11" pointer-events="none">out/{repo}/data/{token}.json   ←   payloads par porteur</text>
      <text class="node-detail" x="1030" y="634" fill="#54504E" font-size="11" pointer-events="none">out/_mailchimp_user_tokens.csv   ←   sync Mailchimp</text>
      <text class="node-detail" x="1030" y="656" fill="#54504E" font-size="11" pointer-events="none">out/_run_manifest.json   ←   récap pour n8n</text>
      <text class="node-detail" x="1030" y="678" fill="#54504E" font-size="11" pointer-events="none">out/logs/run-{date}.jsonl   ←   logs structurés</text>
      <text class="node-detail" x="1030" y="716" fill="#7A7470" font-size="10" font-style="italic" pointer-events="none">push_payloads.sh distribue ensuite vers les repos publics</text>


      <!-- ===================== 4. PAGES PORTEURS ===================== -->
      <g class="node-group" data-id="hier-notations">
        <rect class="node-rect" x="1480" y="110" width="340" height="140" rx="3" fill="#FBF7F1" stroke="#A3695B" stroke-width="1.5"/>

        <text class="node-detail" x="1650" y="232" fill="#A3695B" font-size="10" font-family="monospace">JOURSDEPV equals 1</text>
      </g>

      <g class="node-group" data-id="utilisation-30d">

      <g class="node-group" data-id="ideas-suggestions">

      <!-- ===================== 5. ARCHIVES + CDN (separate right column) ===================== -->
      <g class="node-group" data-id="notations-mai">
        <rect class="node-rect" x="1920" y="110" width="280" height="140" rx="3" fill="#F2EBDF" stroke="#C2B59B" stroke-dasharray="3 4"/>
        <text class="node-sub" x="2060" y="138" fill="#7A7470">LEGACY · MAI 2026</text>

        <text class="node-detail" x="2060" y="234" fill="#7A7470" font-size="10">⚠ pas branché au pipeline</text>
      </g>

      <g class="node-group" data-id="assets">
        <rect class="node-rect" x="1920" y="270" width="280" height="490" rx="3" fill="#F2EBDF" stroke="#A3695B" stroke-width="1.5"/>
        <text class="node-sub" x="2060" y="298" fill="#54504E">CDN GITHUB PAGES</text>
        <text class="node-label" x="2060" y="324" fill="#2C2826" font-size="18">bodypass-assets</text>
        <text class="node-detail" x="2060" y="352" fill="#54504E">191 photos + default</text>
        <text class="node-detail" x="2060" y="372" fill="#54504E" font-size="11">1200×800 JPEG q80</text>

        <line x1="1950" y1="396" x2="2170" y2="396" stroke="#C2B59B" stroke-width="0.5"/>

        <text class="node-detail" x="2060" y="420" fill="#54504E" font-size="11">URL CDN :</text>

// =========================================
// INTERACTIONS
// =========================================
const svgRoot = document.getElementById('svgRoot');
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
let scale = 1, tx = 0, ty = 0;
let isDragging = false, lastX, lastY;

function updateTransform() {
  viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

canvas.addEventListener('mousedown', e => {
  if (e.target.closest('.node-group')) return;
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  updateTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svgRoot.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.3, Math.min(4, scale * delta));
  // zoom vers le pointeur
  const sx = (mx - tx) / scale;
  const sy = (my - ty) / scale;
  tx = mx - sx * newScale;
  ty = my - sy * newScale;
  scale = newScale;
  updateTransform();
}, { passive: false });

document.getElementById('zoomIn').onclick = () => {
  scale = Math.min(4, scale * 1.2); updateTransform();
};
document.getElementById('zoomOut').onclick = () => {
  scale = Math.max(0.3, scale * 0.83); updateTransform();
};
document.getElementById('reset').onclick = () => {
  scale = 1; tx = 0; ty = 0; updateTransform();
};
document.getElementById('export').onclick = () => {
  const svgData = new XMLSerializer().serializeToString(svgRoot);
  const blob = new Blob([svgData], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bodypass-architecture.svg';
  a.click();
};

// Click nodes
document.querySelectorAll('.node-group').forEach(n => {
  n.addEventListener('click', e => {
    e.stopPropagation();
    const id = n.dataset.id;
    openPanel(id);
  });
});

function openPanel(id) {
  const data = DETAILS[id];
  if (!data) return;
  const content = document.getElementById('panelContent');
  let html = `
    <div class="eyebrow">${data.eyebrow}</div>
    <h2>${data.title}</h2>
    <div class="repo">${data.repo}</div>
  `;
  for (const [heading, body] of data.sections) {
    html += `<h3>${heading}</h3>${body}`;
  }
  content.innerHTML = html;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}
window.closePanel = closePanel;

// ESC ferme panel
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

// Auto-fit initial : laisser le SVG remplir naturellement le viewport
window.addEventListener('load', () => {
  scale = 1; tx = 0; ty = 0; updateTransform();
});
</script>
